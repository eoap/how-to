name: Acceptance and release
on:
  push:
    branches: [main, develop, feature/pde-typed-cwl]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the accepted stable version from main
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: how-to-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the locked environment and Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          uv venv --python 3.12 .venv
          uv pip sync --python .venv/bin/python --require-hashes requirements-notebooks.txt
          uv pip check --python .venv/bin/python
      - name: Validate release metadata and immutable images
        run: .venv/bin/python scripts/check-release.py
      - name: Validate standalone CWL and generated Markdown
        run: .venv/bin/python scripts/cwl-docs.py --validate --output acceptance-results/cwl-docs
      - name: Execute all ten cases with real EO inputs
        run: |
          source .venv/bin/activate
          python scripts/run-workflows.py --runner cwltool --output "$GITHUB_WORKSPACE/acceptance-results/workflows"
      - name: Build documentation strictly
        run: .venv/bin/mkdocs build --strict --site-dir acceptance-results/site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ github.sha }}
          path: acceptance-results/

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: acceptance
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install registry publication tools
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Check version has not been published
        run: |
          version=$(jq -er .version codemeta.json)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$version" --jq '.[].ref' > /tmp/existing-tags
          if grep -Fxq "refs/tags/$version" /tmp/existing-tags; then
            echo 'Version already tagged'; exit 1
          fi
          if skopeo inspect "docker://ghcr.io/eoap/how-to/rio:$version" >/dev/null 2>&1; then
            echo 'Image version already published'; exit 1
          fi
      - name: Publish the validated runtime without rebuilding it
        run: |
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          skopeo copy --all --preserve-digests docker://ghcr.io/eoap/how-to/rio@sha256:f4b2273ca2383bbf63c14966ad1ee25b35ccd72f73e33339951fdbe894732dbf "docker://ghcr.io/eoap/how-to/rio:$VERSION"
          test "$(skopeo inspect --format '{{.Digest}}' "docker://ghcr.io/eoap/how-to/rio:$VERSION")" = sha256:f4b2273ca2383bbf63c14966ad1ee25b35ccd72f73e33339951fdbe894732dbf
      - name: Stage unchanged validated CWL and checksums
        run: |
          mkdir release-assets
          cp cwl-workflows/*.cwl requirements-notebooks.txt project.toml release-assets/
          cd release-assets
          sha256sum *.cwl requirements-notebooks.txt project.toml > SHA256SUMS
      - name: Publish the stable release after all assets are ready
        run: |
          gh release create "$VERSION" release-assets/* --target "$GITHUB_SHA" --title "CWL How-To $VERSION" --notes-file RELEASE_NOTES.md
