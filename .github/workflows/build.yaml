name: Acceptance and release
on:
  push:
    branches: [main, develop, feature/pde-typed-cwl]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the accepted stable version from main
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: how-to-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the locked environment and Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          uv venv --python 3.12 .venv
          uv pip sync --python .venv/bin/python --require-hashes requirements/development.txt
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation -e .
          uv pip check --python .venv/bin/python
      - name: Check the locked Hatch development environment
        run: .venv/bin/hatch run dev:check
      - name: Build the intended processing runtime
        run: |
          docker build -t localhost/how-to-rio:${{ github.sha }} .
          docker run --rm localhost/how-to-rio:${{ github.sha }} rio color --help
          docker save localhost/how-to-rio:${{ github.sha }} -o /tmp/how-to-runtime.tar
          podman load -i /tmp/how-to-runtime.tar
      - name: Validate release metadata and immutable images
        run: .venv/bin/python scripts/check-release.py
      - name: Validate standalone CWL and generated Markdown
        run: .venv/bin/python scripts/cwl-docs.py --validate --output acceptance-results/cwl-docs
      - name: Execute all eleven cases with real EO inputs
        run: |
          source .venv/bin/activate
          python scripts/run-workflows.py --runner cwltool --processing-image "localhost/how-to-rio:${{ github.sha }}" --output "$GITHUB_WORKSPACE/acceptance-results/workflows"
      - name: Build documentation strictly
        run: .venv/bin/mkdocs build --strict --site-dir acceptance-results/site
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ github.sha }}
          path: /tmp/how-to-runtime.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ github.sha }}
          path: acceptance-results/

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: acceptance
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install registry publication tools
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Check version has not been published
        run: |
          version=$(jq -er .version codemeta.json)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$version" --jq '.[].ref' > /tmp/existing-tags
          if grep -Fxq "refs/tags/$version" /tmp/existing-tags; then
            echo 'Version already tagged'; exit 1
          fi
          if skopeo inspect "docker://ghcr.io/eoap/how-to/rio:$version" >/dev/null 2>&1; then
            echo 'Image version already published'; exit 1
          fi
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: runtime-${{ github.sha }}
          path: accepted-runtime
      - name: Publish the accepted image without rebuilding
        run: |
          docker load -i accepted-runtime/how-to-runtime.tar
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag localhost/how-to-rio:${{ github.sha }} "ghcr.io/eoap/how-to/rio:$VERSION"
          docker push "ghcr.io/eoap/how-to/rio:$VERSION"
          docker pull "ghcr.io/eoap/how-to/rio:$VERSION"
          docker inspect "ghcr.io/eoap/how-to/rio:$VERSION" --format '{{index .RepoDigests 0}}' > /tmp/accepted-image
      - name: Prepare and validate the digest-pinned standalone release assets
        run: |
          uv venv --python 3.12 .venv
          uv pip install --require-hashes -r requirements/development.txt
          uv pip install --no-deps --no-build-isolation -e .
          .venv/bin/python scripts/prepare-runtime-release.py --image "$(cat /tmp/accepted-image)" --output release-assets
          for document in release-assets/*.cwl; do .venv/bin/cwltool --validate "$document"; done
          cp cwl-workflows/custom-types.yaml requirements-notebooks.txt project.toml release-assets/
          cp requirements/development.txt requirements/runtime.txt release-assets/
          cd release-assets
          sha256sum * > SHA256SUMS
      - name: Publish the stable release after all assets are ready
        run: |
          gh release create "$VERSION" release-assets/* --target "$GITHUB_SHA" --title "CWL How-To $VERSION" --notes-file RELEASE_NOTES.md
